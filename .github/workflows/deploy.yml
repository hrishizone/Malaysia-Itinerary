name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/malaysia-itinerary-io5e39]
  workflow_dispatch:

# Publishing to the gh-pages branch only needs write access to the repo
# contents — unlike the Pages API, which the Actions token cannot call here.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare artifact
        run: |
          # Single-page site, so unknown paths should still serve the app
          cp dist/index.html dist/404.html
          # Stop GitHub from running the output through Jekyll
          touch dist/.nojekyll

      - name: Publish to gh-pages
        env:
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
